aid: feastables
name: Feastables
description: >-
  Feastables is the consumer snack brand founded by Jimmy Donaldson (MrBeast),
  selling chocolate bars, peanut butter cups, sour gummies, milk and variety boxes
  direct at feastables.com and across roughly 30,000 retail locations in the US,
  Canada and Mexico. Its stated mission is to eradicate child labor in the chocolate
  industry. Feastables ships no developer API and no OpenAPI, but its Shopify-hosted
  storefront exposes a substantial agentic-commerce surface on its own origin: an
  /agents.md and mirrored /llms.txt declaring how AI agents should transact, a
  dedicated agentic-discovery sitemap, a Universal Commerce Protocol merchant
  profile at /.well-known/ucp, OAuth 2.0 and OpenID Connect discovery documents for
  customer accounts, an anonymous Storefront MCP server at /api/mcp answering
  tools/list with five real tools, and a gated UCP Shopping MCP server at
  /api/ucp/mcp carrying the cart, checkout, fulfillment and discount capabilities.
