apis:
- name: Feastables Storefront MCP
  description: >-
    Anonymous Model Context Protocol server served from the Feastables origin.
    Answers initialize and tools/list with no credential (probed 2026-08-01, HTTP
    200) and returns five tools with full JSON Schema input contracts:
    search_catalog, get_product_details, get_cart, update_cart and
    search_shop_policies_and_faqs. Identifies as storefront-renderer 0.1.0 over MCP
    protocol version 2025-06-18.
  humanURL: https://feastables.com/agents.md
  baseURL: https://feastables.com/api/mcp
  tags:
  - MCP
  - Agentic Commerce
  - Catalog
  properties:
  - type: MCPServer
    url: mcp/feastables-mcp.yml
  - type: ToolCrosswalk
    url: mcp/feastables-tool-crosswalk.yml
  - type: AgentSkill
    url: skills/feastables-shop-catalog.md
- name: Feastables UCP Shopping Service
  description: >-
    Universal Commerce Protocol shopping service over MCP transport, advertised in
    the store's own /.well-known/ucp profile at UCP version 2026-04-08 (also serving
    2026-01-23). Carries the full commerce lifecycle - cart, checkout, fulfillment,
    discount and order - across thirteen methods. Gated: every call requires a
    UCP-Agent profile URI, and checkout requires explicit buyer approval.
  humanURL: https://feastables.com/.well-known/ucp
  baseURL: https://feastables.com/api/ucp/mcp
  tags:
  - UCP
  - MCP
  - Agentic Commerce
  - Checkout
  properties:
  - type: MCPServer
    url: mcp/feastables-mcp.yml
  - type: AgentSkill
    url: skills/feastables-agentic-checkout.md
- name: Feastables Storefront JSON
  description: >-
    Read-only JSON endpoints the store documents in /agents.md for agents that only
    need to read store data without transacting - GET /products.json,
    /products/{handle}.json, /collections/{handle}/products.json and
    /search?q={query}&type=product. No authentication required.
  humanURL: https://feastables.com/agents.md
  baseURL: https://feastables.com
  tags:
  - Catalog
  - Products
  - Ecommerce
  properties:
  - type: DataModel
    url: data-model/feastables-data-model.yml
